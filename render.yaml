services:
  - type: web
    name: eurohouse-api
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @eurohouse/api build
    startCommand: pnpm --filter @eurohouse/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eurohouse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://eurohouse-admin.onrender.com,https://eurohouse-npp.onrender.com,https://eurohouse-mobile.onrender.com
      - key: DEMO_ADMIN_EMAIL
        value: board@eurohouse.vn
      - key: DEMO_ADMIN_PASSWORD
        sync: false

  - type: web
    name: eurohouse-admin
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @eurohouse/admin build
    startCommand: pnpm --filter @eurohouse/admin exec next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://eurohouse-api.onrender.com/api
      - key: NEXT_PUBLIC_DEMO_EMAIL
        value: board@eurohouse.vn
      - key: NEXT_PUBLIC_DEMO_PASSWORD
        sync: false

  - type: web
    name: eurohouse-npp
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @eurohouse/npp build
    startCommand: pnpm --filter @eurohouse/npp exec next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://eurohouse-api.onrender.com/api

  - type: web
    name: eurohouse-mobile
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @eurohouse/mobile exec expo export --platform web
    staticPublishPath: apps/mobile/dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://eurohouse-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: eurohouse-db
    databaseName: eurohouse
    user: eurohouse
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
